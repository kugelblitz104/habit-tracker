[project]
name = "habit_tracker"
version = "0.1.0"
description = "habit tracker api"
authors = [{name = "Justin Jones", email = "kugelblitz104@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv",
    "sqlalchemy",
    "fastapi[standard]",
    "pydantic[email]",
    "alembic>=1.17.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.11.0",
    "asyncpg>=0.30.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "httpx>=0.28.1",
    "icalendar>=7.2.0",
    "recurring-ical-events>=3.8.2",
    "aiosmtplib>=5.1.2",
    "cryptography>=49.0.0",
]

[tool.uv]
package = true
native-tls = true

[dependency-groups]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-xdist>=3.6.0",
    "factory-boy>=3.3.3",
]
dev = ["ruff>=0.14", "basedpyright>=1.31"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    # DTZ011/DTZ005/DTZ001/DTZ901 - this API deliberately stores and
    # serialises NAIVE datetimes: FastAPI/Pydantic emit them with no
    # timezone designator, and the front-end's `parseServerDate` appends
    # "Z" itself precisely because of that contract (see the front-end's
    # src/lib/date-utils.ts). Making these tz-aware would change the wire
    # format and break the client. Timezone handling is done explicitly
    # where it matters, via core/dependencies.py's `resolve_timezone` /
    # `resolve_today` and the `tz` query param - not by making every stored
    # timestamp aware.
    "DTZ011",
    "DTZ005",
    "DTZ001",
    "DTZ901",
    # B008 - flags `Depends(...)` in a function default, which is FastAPI's
    # fundamental dependency-injection idiom. A false positive for this
    # framework.
    "B008",
]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[[tool.basedpyright.executionEnvironments]]
# factory_boy's documented pattern is every Factory subclass declaring its
# own inner `Meta` class, which structurally "overrides" the `Meta` on
# `SQLAlchemyModelFactory`/`BaseFactory` - that's the library's supported
# usage, not an accidental shadowing bug, so this check is a false positive
# for every factory in tests/factories.py. Scoped to tests/ only; src/ keeps
# the rule at its default.
root = "tests"
extraPaths = ["."]
reportIncompatibleVariableOverride = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop per test session (per xdist worker): lets the SQLAlchemy
# engine reuse pooled asyncpg connections across tests instead of paying
# connection setup for every test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "asyncio: mark test as an async test",
]
